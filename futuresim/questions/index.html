<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FutureSim Questions</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ '/futuresim/' | absolute_url }}">
  <!-- The questions used to be a page of their own here. They are now a section of the FutureSim
       page, so old links are sent there; a link to one question (#q-<id>) keeps its question. -->
  <script>
    location.replace({{ '/futuresim/' | relative_url | jsonify }} + (/^#q-[\w-]+$/.test(location.hash) ? location.hash : '#questions'));
  </script>
  <meta http-equiv="refresh" content="0; url={{ '/futuresim/#questions' | relative_url }}">
</head>
<body>
  <p>The questions are now on the <a href="{{ '/futuresim/#questions' | relative_url }}">FutureSim page</a>.</p>
</body>
</html>
